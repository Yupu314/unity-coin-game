<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity コイン集めゲーム</title>
    <style>
        body {
            margin: 0;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: none;
        }
        #game-container {
            width: 360px;
            height: 480px;
            position: relative;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .ui-container {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            width: 360px;
        }
        .score-box {
            background: #fff;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 18px;
            border-radius: 6px;
            flex: 1;
            text-align: center;
        }
        .btn-respawn {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="unity-canvas"></canvas>
    </div>
    <div class="ui-container">
        <div class="score-box" id="score-text">コイン: 0 枚</div>
        <button class="btn-respawn" id="respawn-btn">コインを再生成</button>
    </div>

    <script src="Build/Build_Output.loader.js"></script>
    <script>
        let unityInstance = null;
        const canvas = document.querySelector("#unity-canvas");

        createUnityInstance(canvas, {
            dataUrl: "Build/Build_Output.data",
            frameworkUrl: "Build/Build_Output.framework.js",
            codeUrl: "Build/Build_Output.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "CoinGame",
            productVersion: "1.0",
        }).then((instance) => {
            unityInstance = instance;
        });

        window.onCoinCollected = function(score) {
            document.getElementById("score-text").innerText = `コイン: ${score} 枚`;
        };

        document.getElementById("respawn-btn").addEventListener("click", () => {
            if (unityInstance) {
                unityInstance.SendMessage("GameManager", "RespawnCoins");
            }
        });

        let isTouching = false;
        function handleTouch(e) {
            if (!unityInstance || e.touches.length === 0) return;
            const rect = canvas.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;

            let dx = touchX - centerX;
            let dy = touchY - centerY;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len > 10) {
                dx /= len;
                dy /= len;
                unityInstance.SendMessage("Unity_Chan_humanoid", "SetMoveDirection", `${dx},${-dy}`);
            }
        }

        canvas.addEventListener("touchstart", (e) => { isTouching = true; handleTouch(e); });
        canvas.addEventListener("touchmove", (e) => { if (isTouching) handleTouch(e); });
        canvas.addEventListener("touchend", () => {
            isTouching = false;
            if (unityInstance) {
                unityInstance.SendMessage("Unity_Chan_humanoid", "SetMoveDirection", "0,0");
            }
        });
    </script>
</body>
</html>
